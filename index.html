    <meta name="description" content="Quesería de mi sin ti — quesos, vinos, licores y productos artesanales. Aparta en línea y recoge en tienda." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <title>Quesería de mi sin ti · Productos artesanales</title>
    <script>
      // Aplica el tema antes de pintar para evitar el parpadeo blanco
      try {
        var t = localStorage.getItem('queseria-tema')
        if (t === 'oscuro' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
